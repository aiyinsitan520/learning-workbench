<!doctype html>
<html lang="zh-CN" data-font="round"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Space · Mac 工作台设计样稿</title><script>

try {

</script><link rel="stylesheet" href="studio.css"><style>body{--mint:#316c60;background:#eff3f2;color:#263c3c;--blue:#316c60;--pale:#e8f2ee;--line:#d8e1dd;--muted:#62746f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}header.macbar{height:68px;position:sticky;top:0;z-index:5;background:rgba(244,248,245,.91);backdrop-filter:blur(18px);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;padding:0 24px;border-bottom:1px solid #d5dfda}.macbar .brand{font:650 18px/1.2 var(--sans);letter-spacing:-.6px;color:#22423b}.macbar .brandmark{width:31px;height:31px;border-radius:10px;background:#32594f}.macbar .brandmark svg{width:21px}.pagegroup{position:relative;isolation:isolate;display:flex;justify-self:center;gap:2px;align-items:center;background:#e1e8e4;border:1px solid #d4ded8;border-radius:15px;padding:4px}.pagegroup button{z-index:1;padding:6px 12px;font-size:13px;color:#50625b;border-radius:10px;white-space:nowrap}.pagegroup [aria-current=page]{color:#173c2f;font-weight:650}.thumb{position:absolute;top:4px;bottom:4px;left:0;background:#fff;border:1px solid #d2dcd6;border-radius:10px;box-shadow:0 1px 3px #364c4017;transition:transform .28s cubic-bezier(.2,.75,.25,1),width .28s;pointer-events:none}.island{position:relative;justify-self:end}.island button{color:white}.islandMain{display:flex;align-items:center;gap:9px;background:#192923;color:#f2f6f3;border:1px solid #364840;border-radius:24px;padding:5px 13px 5px 6px;font-size:12px;min-height:36px}.island img{height:24px;width:24px;border-radius:50%;object-fit:cover}.statusDot{width:7px;height:7px;background:#9fd3ae;border-radius:50%}.islandbox{position:absolute;right:0;top:calc(100% + 7px);background:#1d3029;color:#eff8f3;border-radius:17px;padding:15px 17px;box-shadow:0 10px 28px #162a2738;width:240px;animation:reveal .18s ease-out;transform-origin:top right}.islandbox small{color:#bad2c4}.islandbox strong{display:block;margin:4px 0 10px;font-size:16px}.islandbox button{border-radius:7px;background:#cfebda;color:#214335;padding:5px 10px;font-size:12px}.islandbox button+button{background:transparent;color:#d5e8da}.shell{grid-template-columns:clamp(218px,18vw,280px) minmax(0,1fr) clamp(190px,16vw,250px);min-height:calc(100vh - 68px);background:linear-gradient(127deg,#dae6df 0%,#f8faf8 38%,#f4f6f2 90%);align-items:start}.left{margin:12px 0 12px 12px;padding:17px 13px;min-height:calc(100vh - 92px);background:rgba(240,247,242,.85);border:1px solid #c9d7ce;border-radius:18px;box-shadow:0 2px 7px #3f58400b;align-self:stretch}.railTools{display:flex;align-items:center;gap:8px;margin-bottom:16px}.railTools button{display:grid;place-items:center;width:29px;height:30px;border:1px solid #cad6cf;border-radius:8px;background:#fbfdfb;color:#315346}.railTools b{font-size:13px;color:#4b6056}.railTools button+button{margin-left:auto}.left .task.active{background:#deebe3;border-color:#c0d5c6}.left .course{color:#3e705e}.railList{display:none}.compact .shell{grid-template-columns:72px minmax(0,1fr) clamp(190px,16vw,250px)}.compact .left{padding:14px 5px;align-items:center}.compact .railTools{flex-direction:column;gap:9px}.compact .railTools button+button{margin:0}.compact .left>:not(.railTools):not(.railList),.compact .railTools b{display:none}.compact .railList{display:grid;gap:8px}.railList button{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:#587066}.railList button[aria-pressed=true]{color:#205a41;background:#d2e4d8}.right{background:transparent;border-left:1px solid #d7e0d9;margin:24px 0;padding:4px 20px;min-height:0}.right #tools{display:none}.right #tools+.rule,.right h2:first-child.macToolsTitle{display:none}.hero{background:#e1eee9;border-color:#c5dacf}.hero h2{color:#28493d}.hero p,.byline,.cardlabel{color:#47675b}.hero:before{opacity:.6}.notebook,.timeline,.studycard{box-shadow:0 2px 6px #273a2f07}.topline h1{letter-spacing:-1px}.datecode{color:#597568}.leftfoot{font-size:11px}.right .progressbox small{font-size:11px}.section-head h2{font-size:16px}.right .record{gap:18px}main{padding:20px clamp(16px,2vw,32px) 24px}.subhead{margin-top:17px}.islandMain:focus-visible,.macbar button:focus-visible{outline:2px solid #437d63;outline-offset:2px}@keyframes reveal{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}@media(max-width:1080px){.pagegroup button{padding:5px 8px}.macbar .brand{font-size:15px}.right{padding:4px 12px}}@media(max-width:830px){header.macbar{height:auto;padding:8px 12px;gap:7px;grid-template-columns:1fr auto}.pagegroup{grid-row:2;grid-column:1/-1;max-width:100%;justify-self:start;overflow:auto}.island{grid-column:2;grid-row:1}.pagegroup button{padding:5px 6px}.left{align-self:stretch;margin:8px 12px;min-height:0}.compact .left{align-items:flex-start}.compact .railTools,.compact .railList{display:flex}.compact .railTools{flex-direction:row;margin-bottom:4px}.right{margin:8px 12px;border:0}.islandbox{z-index:2}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}.pagegroup{margin:0;grid-template-columns:none}.macbar .islandMain:hover{filter:brightness(1.1)}.compact .left #newTask{display:none}@media(max-width:830px){.shell{align-items:stretch}main{width:100%;max-width:100%}}.railList button{font-weight:650;font-size:13px}.altLayout{margin-left:auto;color:#426653;font-size:11px}</style><link rel="stylesheet" href="手绘布局.css"></head>
<body><header class="macbar"><div class="brand"><span class="brandmark" data-icon="book"></span>Learning Space</div><div class="context"><span>个人学习空间</span><i>/</i><b id="contextPage">今日工作台</b></div><div class="barActions"><label class="fontSwitch" title="关闭用系统字体，开启用圆体"><input type="checkbox" id="roundFont" role="switch">圆体</label><div class="island"><button class="islandMain" aria-expanded="false" aria-controls="islandBox" aria-label="贾维喵专注灵动岛"><img src="kitten.png" alt=""><b>贾维喵</b><span class="statusDot"></span><span id="islandTime">待专注</span></button><section class="islandbox" id="islandBox" hidden><small>当前学习任务</small><strong id="islandTask"></strong><button id="islandAct"></button><button data-action="choose">换任务</button><button data-page="focus">专注详情</button></section></div></div></header>
<div class="shell"><aside class="left"><div class="railTools"><button id="collapse" aria-label="折叠任务侧栏" title="折叠任务侧栏" aria-expanded="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button><b>任务侧栏</b><button id="quickAdd" title="新建任务" aria-label="新建任务">＋</button></div><div class="railList" aria-label="任务快捷入口"></div><div class="section-head"><h2>未完成任务</h2><b class="count" id="count"></b></div>
<form id="newTask"><input maxlength="48" id="newTitle" aria-label="新任务名称" placeholder="写下一个新任务…"><button title="添加任务" aria-label="添加任务">＋</button></form><div id="pending"></div>
<div class="leftfoot"><span data-icon="folder"></span> 我的工作台 <a class="altLayout" href="index.html">初版布局</a></div></aside>
<main id="main"></main><aside class="right"><h2 class="macToolsTitle">功能选择</h2><nav id="tools" aria-label="切换中央页面"></nav><div class="rule"></div><div class="section-head"><h2>今日完成</h2><span id="doneCount" class="count"></span></div><div class="progressbox"><div><strong id="percent"></strong><small>今日任务完成度</small></div><div class="track"><i id="progress"></i></div></div><div id="done"></div><div class="rule"></div><div class="section-head"><h2>学习记录</h2><span data-icon="activity"></span></div><div class="record"><div><strong id="minutes">45</strong><small>分钟专注</small></div><div><strong id="sessions">2</strong><small>次专注</small></div></div></aside></div>
<dialog id="dialog"><form method="dialog"><button class="close" aria-label="关闭">×</button></form><div id="dialogBody"></div></dialog><div id="toast" role="status"></div>
<script src="studio.js"></script><script>const island=$('.island'), popup=$('#islandBox'), fold=$('#collapse');
const fontSwitch = document.getElementById('roundFont');
fontSwitch.checked = document.documentElement.dataset.font === 'round';
fontSwitch.addEventListener('change', () => {
  const style = fontSwitch.checked ? 'round' : 'regular';
  document.documentElement.dataset.font = style;
  try { localStorage.setItem(fontPreferenceKey, style); } catch { /* Keep this session's choice. */ }
});
function syncContext(){
  document.body.dataset.page=current;
  $('#contextPage').textContent=pages[current];
}
function syncIsland(){const t=get(bound)||selectedTask();$('#islandTime').textContent=deadline?timerLabel():bound?'已暂停':finished?'已记录':'待专注';$('#islandTask').textContent=t?.name||'自由专注';$('#islandAct').textContent=deadline?'暂停计时':bound?'继续计时':'开始 25 分钟';$('#islandAct').disabled=!bound&&!t}
function syncRail(){const rail=$('.railList');rail.replaceChildren();tasks.filter(t=>!t.done).forEach(t=>{const b=document.createElement('button');b.dataset.task=t.id;b.title=t.name;b.setAttribute('aria-label',t.name);b.setAttribute('aria-pressed',String(t.id===selected));b.textContent=({'通信原理':'通','电路基础':'电','线性代数':'线','高等数学':'数','学术英语':'英'})[t.course]||'学';rail.append(b)})}
function setFold(on){document.body.classList.toggle('compact',on);fold.setAttribute('aria-expanded',String(!on));fold.title=on?'展开任务侧栏':'折叠任务侧栏';fold.setAttribute('aria-label',fold.title)}
fold.onclick=()=>setFold(!document.body.classList.contains('compact'));$('#quickAdd').onclick=()=>{setFold(false);$('#newTitle').focus()};
function showIsland(on){popup.hidden=!on;$('.islandMain').setAttribute('aria-expanded',String(on));if(on)syncIsland()}
$('.islandMain').onclick=()=>showIsland(popup.hidden);
$('#islandAct').onclick=()=>{if(deadline){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));deadline=0;draw()}else start();syncIsland()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!popup.hidden){showIsland(false);$('.islandMain').focus()}});
document.addEventListener('click',e=>{if(!island.contains(e.target)||e.target.closest('button[data-page],button[data-action]'))showIsland(false)});
new MutationObserver(()=>{syncContext();syncRail();syncIsland()}).observe($('#main'),{childList:true});
setInterval(syncIsland,500);syncContext();syncRail();syncIsland();</script></body></html>
